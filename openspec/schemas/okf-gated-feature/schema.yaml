name: okf-gated-feature
version: 6
description: OpenSpec workflow with an OKF-linked knowledge gate and a test-first implementation gate
artifacts:
  - id: okf-link
    generates: okf-link.md
    description: Pointer table from this change to the durable OKF entries it touches
    template: okf-link.md
    instruction: |
      This artifact is a pointer table, not a content draft. Durable knowledge
      lives in exactly one place per capability: `.okf/features/<capability>.md`.
      Never copy that content here.

      NAMING - an entry is named after the CAPABILITY, never after the change.
      `add-user-auth`, `fix-auth-mfa` and `improve-login` are three changes to
      one capability: `user-auth`. Use the name under `openspec/specs/` or the one
      this change introduces.

      SCOPE - an entry holds only knowledge a second change to the capability
      would still need. A validation message, a form layout, one endpoint's
      payload shape do not belong in it.

      Steps:

      1. List the capabilities this change touches. This runs before
         proposal.md exists, so it is your best read of the request; the proposal
         step reconciles the two.

      2. For each, search `.okf/index.md` and `.okf/features/` for an existing
         entry. Enrich rather than create a near-duplicate; ask the user only
         when several candidates are genuinely plausible.

      3. No entry yet: create one from `.okf/templates/feature.md.tmpl`. Delete
         every section you have no real content for. Set
         `verification_state: unverified`, add this change id to
         `pending_changes` and `linked_changes`, and record the source in
         `sources` (a PRD path, or a short quote of the request). Reference a
         change as `change:<change-id>`, never as a path under
         `openspec/changes/`, which moves at archive. Leave `code_paths` empty.
         Set `criticality: high` only for auth, permissions, money, or customer
         data.

      4. Entry exists: enrich it in place, append this change id to
         `pending_changes` and `linked_changes`. Do not touch
         `verification_state` or `verified_at` - only the verification pass
         moves those. An entry may stay `verified` while a change is pending.

      5. Every new business rule gets the next `BR-n` in that file. Never
         renumber, never reuse. A rule that no longer applies stays, marked
         `(deprecated in <change-id>)`.

      6. A capability with no domain knowledge (build tooling, a log format, a
         dependency bump) still gets a row, with
         `no domain knowledge - <specific reason>` instead of a path. Do not
         create an empty entry.

      7. Optional: if a decision under `.okf/decisions/` or another entry
         constrains this change, list it under Related Knowledge with what to
         read in it. Files listed there are read, not modified; a file that
         turns out to need editing moves up into the OKF Link table.

      8. Add or update the entry's row in `.okf/index.md`.

      Inferred details go under Assumptions and unresolved blockers under Open
      Questions in the entry itself - never in this file.
    requires: []
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: |
      Create the proposal that establishes WHY this change is needed.

      Read the OKF entries listed in okf-link.md FIRST - they come ahead of
      anything said in conversation. Cite a rule by its id (`BR-3`) instead of
      restating it. Do not ask the user a question the entry already answers;
      its Assumptions and Open Questions are what should generate questions.

      Sections:

      - **Why**: 1-2 sentences on the problem or opportunity.
      - **What Changes**: specific bullets. Mark breaking changes **BREAKING**.
      - **Capabilities**:
        - **New Capabilities**: each becomes `specs/<name>/spec.md` and
          `.okf/features/<name>.md`. Kebab-case.
        - **Modified Capabilities**: existing capabilities whose REQUIREMENTS
          change. Each needs a delta spec. Leave empty if none.
      - **Scope And Non-Goals**
      - **Acceptance Criteria**: testable; each maps to a test case.
      - **Risks**
      - **Impact**: affected code, APIs, dependencies, systems.

      Before finishing, make okf-link.md list exactly the capabilities in the
      Capabilities section - create or enrich the missing entries as the
      okf-link instruction says. Then enrich each linked entry with the durable
      knowledge this proposal surfaced (scope, actors, new `BR-n` rules), so it
      is not left a bare stub.

      Keep it to 1-2 pages. Why, not how.
    requires:
      - okf-link
  - id: specs
    generates: specs/**/*.md
    description: Detailed specifications for the change
    template: spec.md
    instruction: |
      Create specification files that define WHAT the system should do.

      One spec file per capability in the proposal's Capabilities section:
      `specs/<capability>/spec.md`, using the existing folder name for a
      modified capability. A NEW capability's file starts with a one-line
      `## Purpose` section - archive copies it into the main spec, which
      otherwise gets a TBD placeholder.

      A change that alters no requirement at all (the knowledge changes but
      no scenario does) writes no spec file: add `skip_specs: true` to the
      change's `.openspec.yaml` and say why in the proposal's Impact section.

      Cite, do not copy. Where a requirement exists because of a rule in the
      linked OKF entry, add `Implements: BR-n` under the requirement text and
      keep the rule's wording in the entry only. A rule you find while writing
      the spec that is not in the entry goes into the entry first, with a new
      `BR-n`, and is then cited.

      Delta operations (use `##` headers):
      - **ADDED Requirements**
      - **MODIFIED Requirements**: MUST include the full updated requirement
      - **REMOVED Requirements**: MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: FROM:/TO: format

      Format:
      - `### Requirement: <name>` followed by the requirement text, SHALL/MUST
      - `#### Scenario: <name>` with WHEN/THEN - exactly four hashtags; three
        fail silently
      - every requirement has at least one scenario

      MODIFIED: copy the ENTIRE existing requirement block from
      `openspec/specs/<capability>/spec.md` (heading through all scenarios),
      paste it under `## MODIFIED Requirements`, then edit. Partial content loses
      detail at archive. Adding a concern without changing existing behavior is
      ADDED, not MODIFIED.

      Example:

      ```
      ## ADDED Requirements

      ### Requirement: User can export data
      The system SHALL allow users to export their data in CSV format.

      Implements: BR-4

      #### Scenario: Successful export
      - **WHEN** user clicks "Export" button
      - **THEN** system downloads a CSV file with all user data
      ```

      Write every scenario so it can become a test case.
    requires:
      - proposal
  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: |
      Explain HOW to implement the change - only if the change warrants it.

      Write a real design if any apply:
      - cross-cutting change or a new architectural pattern
      - a new external dependency, or significant data model changes
      - security, performance, or migration complexity
      - ambiguity worth settling before code is written

      If none apply, the file contains exactly one line and nothing else:

          Not required because <specific reason>.

      "Because it is small" is not a reason; name what makes it small.

      Sections when a design is needed: Context, Goals / Non-Goals, Decisions
      (with the alternatives considered), Risks / Trade-offs, Migration Plan,
      Open Questions.

      Mark any decision that will still matter after this change ships - the
      verification pass promotes it to `.okf/decisions/`.
    requires:
      - proposal
  - id: test-cases
    generates: test-cases.md
    description: Test case matrix before implementation
    template: test-cases.md
    instruction: |
      Derive test cases from the linked OKF entries, the proposal and the specs.
      Cover unit, integration, and E2E levels where relevant, plus negative and
      boundary cases.

      Three mappings must be complete:
      - every acceptance criterion maps to at least one test case
      - every spec scenario maps to at least one test case
      - every `BR-n` this change touches maps to at least one test case

      A level that does not apply goes in Not Applicable with a specific reason.

      For negative and boundary cases, consider at least: absence (null, empty,
      missing record), numeric edges (0, 1, -1, the limit and one past it),
      duplication (a repeated submission), staleness, authorisation (an actor
      who may not act), and scope isolation (data crossing a tenant or user
      boundary). Write the ones that apply; skip the rest.

      A change with a user interface covers the loading, error, empty and
      populated states, and checks that failure is shown to the user.

      Cite the `BR-n` in the Source column wherever a case exists because of a
      rule - that is what makes BR-n -> spec -> test -> code traceable.

      Tests express behavior through public contracts, not implementation
      structure, and assert on what the caller observes, never on mock call
      counts.
    requires:
      - specs
  - id: test-plan
    generates: test-plan.md
    description: Concrete test implementation plan
    template: test-plan.md
    instruction: |
      Map test cases to concrete test files, test names, fixtures, and commands.

      This file must exist before implementation - it is a hard gate. If the
      change is genuinely not testable (a documentation or config rename with no
      observable behavior), still create it and write
      "Not Applicable because <specific reason>" under Test Strategy. Never use
      that to avoid testing behavior that could be tested.

      Test status uses exactly four values:
      - `planned`  - a row here only; no test file yet
      - `skeleton` - the file exists, declared with the runner's pending
                     mechanism (`it.todo`, `test.todo`, `test.fixme`)
      - `failing`  - executable, failing on its ASSERTION, not on a missing
                     import or a type error
      - `passing`  - green

      Test-first, by level:

      - **Unit tests for business rules** reach `failing` before their
        implementation task starts. Contract stubs (types, signatures, a route
        returning 501, bodies that only `throw new Error('not implemented')`)
        let them compile; a stub MUST NOT contain logic. Initial Status records
        the actual failure, e.g. `failing: expected 403, got 200`.

      - **Integration and E2E tests** are written before implementation too, and
        may start as `skeleton` while their harness is not ready. A test file
        first created after the code it covers can no longer refute it.

      `Initial Status` is where a row stood when implementation started;
      `Status` is where it stands now. Move `Status`, never rewrite
      `Initial Status` - it is the record that the tests came first.

      Every row still `skeleton` or `planned` at archive goes in Known Gaps with
      a reason and an owner.

      Take the test and lint commands from the Project commands section of
      `AGENTS.md`. If it is missing, derive them from the project manifest,
      confirm with the user, and add them there.

      A pre-written test changes only when the OKF entry or spec changed first,
      or when it has a mechanical defect. Record either case in the Test Changes
      table.
    requires:
      - test-cases
  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: |
      Break the work into tasks, following the template's group order: Contract
      Stubs, Pre-Implementation Unit Tests, Integration And E2E Skeletons,
      Implementation, Integration Tests, E2E Tests, Verification And OKF Pass.
      Rename, split, or drop groups to fit the change; do not reorder them, and
      do not fold test tasks into implementation tasks.

      Every test file is created before the Implementation group. The groups
      after it only promote files that already exist.

      When code and a pre-written test disagree, the code is wrong by default.
      When the rule itself turns out wrong, repair in this order: the OKF entry,
      the spec, the Test Changes row in test-plan.md, the test, the code.

      **IMPORTANT**: every task is a checkbox `- [ ] X.Y <description>` - apply
      parses this format to track progress.

      The verification group is concrete work, not boilerplate: evidence for
      each `BR-n`, entry frontmatter updated, this change id removed from
      `pending_changes`.
    requires:
      - specs
      - design
      - test-plan
  - id: verification
    generates: verification.md
    description: Final verification evidence, including the OKF verification pass
    template: verification.md
    instruction: |
      Record the commands actually run and their real results, including what
      was skipped and why: OpenSpec validation, tests at each level, lint.

      Then run the OKF verification pass - the step that decides whether the
      knowledge can be trusted:

      1. Read each entry in okf-link.md's OKF Link table, and anything listed
         under Related Knowledge.

      2. Fill Rule Evidence: one row per `BR-n` this change touches, with a real
         `path/to/file.ts:120` or the name of the test that protects it. You
         wrote the code, so read it rather than recalling what you intended.

      3. Give each row a verdict and act on it:
         - `match`    - nothing to do
         - `okf-gap`  - the entry was stale, the code is right: update the entry
                        and say what changed
         - `code-gap` - the entry is right, the code is wrong: fix the code.
                        Never edit the entry to agree with a bug
         - `conflict` - genuine disagreement, or a fix that changes meaning for
                        other features: ask the user. Only this may end in
                        `needs-revision`

      4. For each linked entry: set `verification_state` (`verified` or
         `needs-revision`, never left `unverified`), set `verified_at` to today's
         date, fill `code_paths` from the evidence, remove this change id from
         `pending_changes`, and append a Verification History row. Remove
         change-local detail that leaked into the entry.

      5. Promote any decision in design.md that outlives this change to
         `.okf/decisions/<YYYY-MM-DD>-<slug>.md` from
         `.okf/templates/decision.md.tmpl`, or note why it is change-local.

      6. Update `.okf/index.md` with each entry's new state.

      7. Run `openspec validate <change-id>` and, for each capability this
         change syncs into `openspec/specs/`, `openspec validate <capability>`.

      8. Run the self-check in `AGENTS.md`.

      An entry that still lists this change in `pending_changes` after archive
      is the exact failure this workflow exists to prevent.
    requires:
      - tasks
apply:
  requires:
    - okf-link
    - test-plan
    - tasks
  tracks: tasks.md
  instruction: |
    Read the context files, work through pending tasks, mark each complete as you
    go.

    Read the OKF entries first - follow every path in okf-link.md. Those entries
    and the specs are the source of truth. If chat and an entry disagree, the
    entry wins until it is deliberately amended.

    Respect the task group order. Contract stubs contain no logic. Unit tests for
    business rules fail on their assertion before the implementation task that
    covers them begins.

    When implementation reveals that a business rule must be different, STOP.
    Do not adjust the test and do not quietly diverge:
      1. Amend `.okf/features/<capability>.md` (new or corrected `BR-n`).
      2. Update the spec that cites it - use openspec-update-change.
      3. Record the reason in test-plan.md under Test Changes.
      4. Then change the test, then the code.

    Pause if you hit blockers or need clarification.
