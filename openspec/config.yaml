schema: okf-gated-feature

context: |
  All feature work follows the OKF + OpenSpec + test-first workflow, and the
  `okf-gated-feature` schema is what carries it. A change created on another schema
  gets none of that schema's artifacts - that is an opt-out, so say so when you make
  it rather than letting the missing files pass as an oversight. The durable OKF
  entry is owed either way: the knowledge outlives the change, and no schema owns it.

  Durable knowledge lives in exactly one place per capability:
  .okf/features/<capability-name>.md - named after the capability, never after the change.
  Never duplicate its content into a change directory; a change points at it via okf-link.md.

  Division of labour: OKF holds domain knowledge (terms, business rules with stable BR-n ids,
  actors, permissions, entities, workflows). OpenSpec specs hold requirements and scenarios,
  and CITE the BR-n ids instead of restating rules - two copies of one sentence drift, a citation cannot.

  Two of that schema's artifacts are mandatory gates, not suggestions: a test-plan must exist
  before implementation, and an OKF entry (even if unverified) must exist before implementation.

  One meta-rule covers every escape hatch in it: never skip a file and never leave a
  section blank - state a specific reason instead. test-plan says "Not Applicable because ...",
  design says "Not required because ...", okf-link says "no domain knowledge - ...".
  A reason that does not name what makes it true is not a reason.

  Before creating any OKF entry, test file, or doc artifact, check whether a template already exists
  (.okf/templates/, this schema's templates/, or an existing project convention) and follow it.

  `okf check` enforces the mechanical half of these rules and `okf index` regenerates .okf/index.md and .okf/log.md.
  Run `okf check` after touching anything under .okf/, and `okf check --archive <change-id>` before archiving.
  It is not advisory: fix what it reports rather than explaining it away.

  Everything else - when to explore, how often to loop propose/update, how deep a design goes -
  stays as flexible as the underlying OpenSpec skills already are.

# Rules reach the agent in the same call as the schema's `instruction` for that
# artifact, and the instruction already carries the whole procedure. A rule that
# restates one is read twice and drifts in two places, so this block holds only
# what the instruction does not say.
#
# The second filter is that rules are injected by artifact id, not by schema:
# `proposal`, `specs`, `design` and `tasks` also reach a change created with
# `--schema spec-driven`, where okf-link.md, test-plan.md and the test-first task
# groups do not exist. A rule naming those files reads as an instruction to fill in
# a file the change will never have. So what stays here must hold on any schema -
# the schema-specific mechanics live in the schema, where the artifacts are real.
rules:
  design:
    - 'Always create design.md, whatever the schema in play says about it being optional. If nothing warrants a design, its entire content is one line: "Not required because <specific reason>." - and "because it is small" is not a reason until it names what makes it small.'
  tasks:
    - Test tasks come before the implementation tasks they cover, and implementation is never the step that first creates a test file.
