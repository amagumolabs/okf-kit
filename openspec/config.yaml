schema: okf-gated-feature

context: |
  This repository keeps three layers of one feature in sync: the OKF entry
  (.okf/features/<capability>.md - domain knowledge and business rules with stable
  BR-n ids), the OpenSpec spec (openspec/specs/<capability>/spec.md - requirements
  and scenarios that CITE BR-n ids instead of restating rules), and the code with
  its tests.

  A change exists because the knowledge or a spec is changing. Requests that leave
  both untouched take a shorter route defined in AGENTS.md (Direct, Quick fix, Rule
  tweak); only a change created through OpenSpec carries these artifacts. A change
  created on another schema gets none of okf-link, test-plan or verification - say
  so when you do it. The OKF entry is owed either way.

  Durable knowledge lives in exactly one place per capability, named after the
  capability, never after the change. A change points at it through okf-link.md and
  never copies it.

  Two prerequisites are hard gates: an OKF entry (even unverified) and a test-plan
  must exist before implementation. Tests that cover new behavior are written and
  seen failing before the code that makes them pass.

  Never skip a file or leave a section blank - state a specific reason instead:
  test-plan says "Not Applicable because ...", design says "Not required because
  ...", okf-link says "no domain knowledge - ...". A reason that does not name what
  makes it true is not a reason.

  Before creating an OKF entry, test file or doc artifact, use the existing template
  (.okf/templates/, this schema's templates/) or project convention.

# Rules are injected by artifact id, and also reach a change created with
# `--schema spec-driven`, so they hold only what is true on any schema.
rules:
  tasks:
    - Test tasks come before the implementation tasks they cover, and implementation is never the step that first creates a test file.

# Read by the archive workflow from OpenSpec 1.7 on; older versions ignore it.
operations:
  archive:
    guidance:
      - "Before archiving a change that has okf-link.md, confirm the OKF verification pass in verification.md is done: every BR-n the change touches has file:line or test evidence and a verdict, every linked entry has verification_state and verified_at set, code_paths filled, and this change id removed from pending_changes. If it is not done, warn and get explicit confirmation before archiving."
