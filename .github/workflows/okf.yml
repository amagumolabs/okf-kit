name: okf

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Drift accumulates over weeks, so the audit runs weekly rather than on every
    # commit. A job that fails a pull request for drift nobody in it caused is a
    # job that gets deleted.
    - cron: '0 6 * * 1'

jobs:
  okf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Fails when .okf/INDEX.md was hand-edited or left stale.
      - name: okf index --check
        run: node bin/okf.mjs index --check

      # Entries, pointers, rule ids, evidence, test statuses, the debt ledger.
      - name: okf check
        run: node bin/okf.mjs check

      - name: validator tests
        run: node test/run.mjs

      # Weekly only: the audit reports drift from work that never opened a change,
      # which is not something a single pull request can be responsible for.
      # The unshallow is required - a truncated history hides drift.
      - name: okf audit
        if: github.event_name == 'schedule'
        run: |
          git fetch --unshallow || true
          node bin/okf.mjs audit

      # A payload file missing from package.json `files` breaks `okf init` only
      # for projects that installed the kit as a package - never in this repo.
      # So pack it, install it into an empty dir, and prove the result works.
      - name: packaged install smoke test
        run: |
          set -euo pipefail
          # npm pack --pack-destination requires the directory to already exist.
          mkdir -p /tmp/pack /tmp/kit /tmp/proj
          npm pack --pack-destination /tmp/pack
          tar -xzf /tmp/pack/*.tgz -C /tmp/kit --strip-components=1
          cd /tmp/proj
          node /tmp/kit/bin/okf.mjs init
          node /tmp/kit/bin/okf.mjs index
          node /tmp/kit/bin/okf.mjs check
          npx --yes @fission-ai/openspec@1.6.0 schema validate okf-gated-feature
