name: okf

on:
  pull_request:
  push:
    branches: [main]

jobs:
  okf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Fails when .okf/INDEX.md was hand-edited or left stale.
      - name: okf index --check
        run: node bin/okf.mjs index --check

      # Entries, pointers, rule ids, evidence, test statuses, the debt ledger.
      - name: okf check
        run: node bin/okf.mjs check

      - name: validator tests
        run: node test/run.mjs

      # A payload file missing from package.json `files` breaks `okf init` only
      # for projects that installed the kit as a package - never in this repo.
      # So pack it, install it into an empty dir, and prove the result works.
      - name: packaged install smoke test
        run: |
          set -euo pipefail
          npm pack --pack-destination /tmp/pack
          mkdir -p /tmp/kit /tmp/proj
          tar -xzf /tmp/pack/*.tgz -C /tmp/kit --strip-components=1
          cd /tmp/proj
          node /tmp/kit/bin/okf.mjs init
          node /tmp/kit/bin/okf.mjs index
          node /tmp/kit/bin/okf.mjs check
          npx --yes @fission-ai/openspec@1.6.0 schema validate okf-gated-feature
